# =====================================================
# External Validation — ISIC 2019-trained model on ISIC 2020
# Uses the same checkpoint, evaluates on ISIC 2020 images
# =====================================================

model_name: field_token_external_2020
model_type: field_token

seed: 42

# --- Data: uses ISIC 2019 processed splits for train/val,
#           but test.csv is swapped to ISIC 2020 external ---
images_dir: data/raw/isic2019/train/images
test_images_dir: data/raw/isic2020/images
processed_dir: data/processed_isic2019_external
encoder_save_path: data/processed_isic2019/metadata_encoder.json

val_frac: 0.20
test_frac: 0.0

# --- Architecture (must match training config) ---
backbone: efficientnet_b2
pretrained: true
freeze_early: false
feature_dim: 256
num_attn_heads: 8
dropout: 0.4

img_size: 224
batch_size: 12
num_workers: 0
use_weighted_sampler: true

epochs: 25
lr: 0.00003
weight_decay: 0.0005
pos_weight: 5.0
patience: 8
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results_isic2019
