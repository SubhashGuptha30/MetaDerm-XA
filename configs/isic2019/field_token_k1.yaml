# Field-Token K=1 ablation (single merged metadata token)
model_name: field_token_k1_isic2019
model_type: field_token_ablated
num_meta_tokens: 1

seed: 42
images_dir: data/raw/isic2019/train/images
test_images_dir: data/raw/isic2019/test/images
processed_dir: data/processed_isic2019
encoder_save_path: data/processed_isic2019/metadata_encoder.json
val_frac: 0.20
test_frac: 0.0

backbone: efficientnet_b2
pretrained: true
feature_dim: 256
num_attn_heads: 8
dropout: 0.3

img_size: 224
batch_size: 12
num_workers: 0
use_weighted_sampler: true
epochs: 25
lr: 0.00003
weight_decay: 0.0005
pos_weight: 5.0
patience: 8
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results_isic2019
