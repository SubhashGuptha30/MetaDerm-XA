# =====================================================
# Field-Token Cross-Attention — ISIC 2019
# Trained on ISIC 2019 (4,500+ melanoma samples)
# Uses v3 regularization settings (best on ISIC 2020)
# =====================================================

model_name: field_token_isic2019
model_type: field_token

seed: 42

# --- Data (ISIC 2019) ---
csv_path: data/raw/isic2019/train/ISIC_2019_Training_GroundTruth.csv  # not used directly
images_dir: data/raw/isic2019/train/images
test_images_dir: data/raw/isic2019/test/images
processed_dir: data/processed_isic2019
encoder_save_path: data/processed_isic2019/metadata_encoder.json

val_frac: 0.20
test_frac: 0.0                 # test set is separate (ISIC 2019 official test)

# --- Architecture ---
backbone: efficientnet_b2
pretrained: true
freeze_early: false
feature_dim: 256
num_attn_heads: 8
dropout: 0.4                   # v3 setting

img_size: 224
batch_size: 12
num_workers: 0
use_weighted_sampler: true

epochs: 25
lr: 0.00003                   # v3 setting
weight_decay: 0.0005           # v3 setting
pos_weight: 5.0                # CHANGED: 17.9% melanoma → ~4.6:1 ratio, so pos_weight ~5
patience: 8
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results_isic2019
