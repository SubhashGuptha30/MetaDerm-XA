# =====================================================
# Field-Token Cross-Attention — v2 (stronger regularization)
# Higher dropout, frozen early backbone, lower LR
# =====================================================

model_name: field_token_v2
model_type: field_token

seed: 42

csv_path: data/raw/isic2020/train.csv
images_dir: data/raw/isic2020/images
processed_dir: data/processed
encoder_save_path: data/processed/metadata_encoder.json

val_frac: 0.15
test_frac: 0.15

# --- Architecture ---
backbone: efficientnet_b2
pretrained: true
freeze_early: true             # CHANGED: freeze early layers to reduce overfitting
feature_dim: 256
num_attn_heads: 8
dropout: 0.45                  # CHANGED: higher dropout (was 0.3)

img_size: 224
batch_size: 12
num_workers: 0
use_weighted_sampler: true

epochs: 30                     # CHANGED: more epochs since freeze_early slows convergence
lr: 0.00003                   # CHANGED: lower LR (was 0.00005)
weight_decay: 0.001            # CHANGED: stronger weight decay (was 0.0001)
pos_weight: 55.0
patience: 10                   # CHANGED: more patience (was 8)
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results
