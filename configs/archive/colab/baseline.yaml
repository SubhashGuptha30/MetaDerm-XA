# =====================================================
# Baseline — Image-Only EfficientNet-B2 (Colab T4 GPU)
# =====================================================

model_name: baseline
model_type: baseline

seed: 42

csv_path: data/raw/isic2020/train.csv
images_dir: data/raw/isic2020/images
processed_dir: data/processed
encoder_save_path: data/processed/metadata_encoder.json

val_frac: 0.15
test_frac: 0.15

backbone: efficientnet_b2
pretrained: true
dropout: 0.4
freeze_early: true

img_size: 224

# --- T4 GPU (16GB VRAM) optimized ---
batch_size: 48
num_workers: 4
use_weighted_sampler: true

epochs: 25
lr: 0.0001
weight_decay: 0.0001
pos_weight: 55.0
patience: 7
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results
