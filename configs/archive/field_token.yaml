# =====================================================
# Field-Token Cross-Attention — Journal Upgrade
# Encodes each metadata variable as a separate token
# =====================================================

model_name: field_token
model_type: field_token

seed: 42

csv_path: data/raw/isic2020/train.csv
images_dir: data/raw/isic2020/images
processed_dir: data/processed
encoder_save_path: data/processed/metadata_encoder.json

val_frac: 0.15
test_frac: 0.15

# --- Architecture ---
backbone: efficientnet_b2
pretrained: true
freeze_early: false
feature_dim: 256
num_attn_heads: 8
dropout: 0.3

img_size: 224
batch_size: 12               # same as cross_attention for fair comparison
num_workers: 0
use_weighted_sampler: true

epochs: 25
lr: 0.00005                  # same LR as cross_attention
weight_decay: 0.0001
pos_weight: 55.0
patience: 8
use_amp: true

checkpoint_dir: checkpoints
reports_dir: reports/results
